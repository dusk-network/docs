name: Build docs and validate links

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Validate package release ages
        run: node scripts/verify-package-release-ages.cjs --days 7

      - name: Pin npm
        run: npm install --global npm@11.18.0 --ignore-scripts
        working-directory: ${{ runner.temp }}

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Run approved dependency scripts
        run: npm rebuild esbuild

      - name: Build, test, and validate links
        run: npm run verify
